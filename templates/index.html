<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        #controls {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
        }
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(52, 152, 219, 0.4);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .listening {
            background-color: #e74c3c !important;
        }
        .thinking {
            background-color: #f39c12 !important;
        }
        #conversation {
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            max-width: 80%;
        }
        .user-message {
            background-color: #e8f4fd;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }
        .assistant-message {
            background-color: #f0f2f5;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }
        .status {
            text-align: center;
            margin: 10px 0;
            font-style: italic;
            color: #7f8c8d;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .status-listening {
            background-color: rgba(231, 76, 60, 0.1);
        }
        .status-processing {
            background-color: rgba(243, 156, 18, 0.1);
        }
        .status-playing {
            background-color: rgba(46, 204, 113, 0.1);
        }
        #error-message {
            color: #e74c3c;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }
        .pulse {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(231, 76, 60, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
            }
        }
        @keyframes thinking {
            0% { background-color: #f39c12; }
            50% { background-color: #e67e22; }
            100% { background-color: #f39c12; }
        }
        .thinking {
            animation: thinking 2s infinite;
        }
        .debug-info {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Assistant</h1>
        <div id="status" class="status status-listening"><span class="pulse"></span> Always listening...</div>
        <div id="error-message"></div>
        <div id="conversation"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('error-message');
            const conversationDiv = document.getElementById('conversation');
            
            let mediaRecorder;
            let audioChunks = [];
            let isRecording = true; // Always in recording mode
            let silenceTimer = null;
            let audioContext;
            let isProcessing = false;
            
            const SILENCE_THRESHOLD = 3000; // 3 seconds of silence before processing
            const NOISE_FLOOR = 10; // Increased from 5 to better handle ambient noise
            
            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            
            async function startListening() {
                try {
                    // Clear error messages when starting to listen
                    errorDiv.textContent = '';
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    isRecording = true;
                    updateStatus('listening');
                    
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.addEventListener('dataavailable', event => {
                        audioChunks.push(event.data);
                    });
                    
                    mediaRecorder.addEventListener('stop', async () => {
                        if (audioChunks.length > 0 && !isProcessing) {
                            isProcessing = true;
                            updateStatus('processing');
                            const audioBlob = new Blob(audioChunks);
                            await processAudio(audioBlob);
                            isProcessing = false;
                        }
                        
                        // Restart listening after processing completes
                        if (isRecording) {
                            startListening();
                        }
                    });
                    
                    // Start recording in small chunks
                    mediaRecorder.start(1000); // 1 second chunks
                    
                    // Set up audio analysis for silence detection
                    const audioAnalysisContext = new AudioContext();
                    const analyser = audioAnalysisContext.createAnalyser();
                    const microphone = audioAnalysisContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    
                    analyser.fftSize = 2048;
                    const bufferLength = analyser.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    
                    function checkAudioLevel() {
                        if (!isRecording) return;
                        
                        analyser.getByteFrequencyData(dataArray);
                        const average = dataArray.reduce((a, b) => a + b) / bufferLength;
                        
                        // Debug audio level if needed
                        // console.log("Audio level:", average);
                        
                        if (average < NOISE_FLOOR) { // Using the noise floor constant
                            if (!silenceTimer && !isProcessing) {
                                silenceTimer = setTimeout(() => {
                                    if (mediaRecorder && mediaRecorder.state === 'recording' && !isProcessing) {
                                        if (audioChunks.length > 0) {
                                            mediaRecorder.stop();
                                            silenceTimer = null;
                                        }
                                    }
                                }, SILENCE_THRESHOLD);
                            }
                        } else {
                            if (silenceTimer) {
                                clearTimeout(silenceTimer);
                                silenceTimer = null;
                            }
                        }
                        
                        if (isRecording) {
                            requestAnimationFrame(checkAudioLevel);
                        }
                    }
                    
                    checkAudioLevel();
                    
                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    errorDiv.textContent = 'Error accessing microphone. Please check permissions.';
                    isRecording = false;
                    updateStatus('error');
                }
            }
            
            function updateStatus(state) {
                statusDiv.className = 'status'; // Reset classes
                switch(state) {
                    case 'listening':
                        statusDiv.innerHTML = '<span class="pulse"></span> Listening...';
                        statusDiv.classList.add('status-listening');
                        break;
                    case 'processing':
                        statusDiv.textContent = 'Processing your request...';
                        statusDiv.classList.add('status-processing');
                        break;
                    case 'playing':
                        statusDiv.textContent = 'Speaking...';
                        statusDiv.classList.add('status-playing');
                        break;
                    case 'ready':
                        statusDiv.innerHTML = '<span class="pulse"></span> Listening...';
                        statusDiv.classList.add('status-listening');
                        break;
                    case 'error':
                        statusDiv.textContent = 'An error occurred. Restart page.';
                        break;
                }
            }
            
            async function processAudio(audioBlob) {
                const formData = new FormData();
                formData.append('audio', audioBlob);
                
                try {
                    const response = await fetch('/process_audio', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        if (data.status === 'no_speech') {
                            // No speech detected, continue listening
                            return;
                        }
                        
                        // Add messages to conversation
                        if (data.input_text && data.llm_response) {
                            addMessage(data.input_text, 'user', null);
                            addMessage(data.llm_response, 'assistant', data.processing_time);
                            
                            // Play audio response if available
                            if (data.audio) {
                                updateStatus('playing');
                                await playResponseAudio(data.audio);
                            }
                        }
                    } else {
                        throw new Error(data.error || 'Unknown error occurred');
                    }
                } catch (error) {
                    console.error('Error processing audio:', error);
                    errorDiv.textContent = error.message || 'Error processing your request.';
                }
                
                updateStatus('ready');
            }
            
            function addMessage(text, sender, processingTime) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(sender + '-message');
                messageDiv.textContent = text;
                
                if (processingTime && sender === 'assistant') {
                    const debugInfo = document.createElement('div');
                    debugInfo.classList.add('debug-info');
                    debugInfo.textContent = `Processing time: ${processingTime}s`;
                    messageDiv.appendChild(debugInfo);
                }
                
                conversationDiv.appendChild(messageDiv);
                
                // Scroll to bottom
                conversationDiv.scrollTop = conversationDiv.scrollHeight;
            }
            
            async function playResponseAudio(audioBase64) {
                return new Promise((resolve, reject) => {
                    try {
                        // Prevent new recordings during playback
                        isProcessing = true;
                        
                        // Convert base64 to array buffer
                        const binaryString = atob(audioBase64);
                        const bytes = new Uint8Array(binaryString.length);
                        
                        for (let i = 0; i < binaryString.length; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }
                        
                        // Decode the audio data
                        audioContext.decodeAudioData(bytes.buffer)
                            .then(buffer => {
                                // Create audio source
                                const source = audioContext.createBufferSource();
                                source.buffer = buffer;
                                source.connect(audioContext.destination);
                                source.start(0);
                                
                                // Resolve when playback finishes
                                source.onended = function() {
                                    // Add a small delay after audio finishes before resuming listening
                                    setTimeout(() => {
                                        isProcessing = false;
                                        resolve();
                                    }, 500);
                                };
                            })
                            .catch(error => {
                                console.error('Error decoding audio:', error);
                                errorDiv.textContent = 'Error playing response audio.';
                                isProcessing = false;
                                reject(error);
                            });
                    } catch (error) {
                        console.error('Error processing audio data:', error);
                        errorDiv.textContent = 'Error processing audio data.';
                        isProcessing = false;
                        reject(error);
                    }
                });
            }
            
            // Start listening automatically on page load
            initAudio();
            startListening();
        });
    </script>
</body>
</html>
