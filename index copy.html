<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        #controls {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
        }
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(52, 152, 219, 0.4);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .listening {
            background-color: #e74c3c !important;
        }
        .thinking {
            background-color: #f39c12 !important;
        }
        #conversation {
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            max-width: 80%;
        }
        .user-message {
            background-color: #e8f4fd;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }
        .assistant-message {
            background-color: #f0f2f5;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }
        .status {
            text-align: center;
            margin: 10px 0;
            font-style: italic;
            color: #7f8c8d;
        }
        #error-message {
            color: #e74c3c;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }
        .pulse {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(231, 76, 60, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
            }
        }
        .debug-info {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Assistant</h1>
        <div id="controls">
            <button id="listen-button">Press to Speak</button>
        </div>
        <div id="status" class="status"></div>
        <div id="error-message"></div>
        <div id="conversation"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const listenButton = document.getElementById('listen-button');
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('error-message');
            const conversationDiv = document.getElementById('conversation');
            
            let mediaRecorder;
            let audioChunks = [];
            let isRecording = false;
            
            // Audio context for playback
            let audioContext;
            
            // Initialize audio on first user interaction
            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            
            listenButton.addEventListener('click', function() {
                initAudio();
                
                if (!isRecording) {
                    startRecording();
                } else {
                    stopRecording();
                }
            });
            
            function startRecording() {
                errorDiv.textContent = '';
                
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        isRecording = true;
                        listenButton.classList.add('listening');
                        listenButton.textContent = 'Listening... Click to Stop';
                        
                        statusDiv.innerHTML = '<span class="pulse"></span> Listening...';
                        
                        audioChunks = [];
                        mediaRecorder = new MediaRecorder(stream);
                        
                        mediaRecorder.addEventListener('dataavailable', event => {
                            audioChunks.push(event.data);
                        });
                        
                        mediaRecorder.addEventListener('stop', () => {
                            const audioBlob = new Blob(audioChunks);
                            processAudio(audioBlob);
                            
                            // Stop all tracks to turn off the microphone
                            stream.getTracks().forEach(track => track.stop());
                        });
                        
                        mediaRecorder.start();
                    })
                    .catch(error => {
                        console.error('Error accessing microphone:', error);
                        errorDiv.textContent = 'Error accessing microphone. Please check permissions.';
                    });
            }
            
            function stopRecording() {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    isRecording = false;
                    listenButton.classList.remove('listening');
                    listenButton.classList.add('thinking');
                    listenButton.textContent = 'Processing...';
                    listenButton.disabled = true;
                    
                    statusDiv.innerHTML = 'Processing your request...';
                    
                    mediaRecorder.stop();
                }
            }
            
            function processAudio(audioBlob) {
                const formData = new FormData();
                formData.append('audio', audioBlob);
                
                const startTime = Date.now();
                
                fetch('/process_audio', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(data => {
                            throw new Error(data.error || 'Unknown error occurred');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const processingTime = (Date.now() - startTime) / 1000;
                    
                    // Display the conversation
                    addMessage(data.input_text, 'user', null);
                    addMessage(data.llm_response, 'assistant', data.processing_time || processingTime.toFixed(2));
                    
                    // Play back the response audio if available
                    if (data.audio) {
                        playResponseAudio(data.audio);
                    } else {
                        statusDiv.textContent = 'Response received (no audio)';
                        resetUI();
                    }
                })
                .catch(error => {
                    console.error('Error processing audio:', error);
                    errorDiv.textContent = error.message || 'Error processing your request.';
                    resetUI();
                });
            }
            
            function addMessage(text, sender, processingTime) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(sender + '-message');
                messageDiv.textContent = text;
                
                if (processingTime && sender === 'assistant') {
                    const debugInfo = document.createElement('div');
                    debugInfo.classList.add('debug-info');
                    debugInfo.textContent = `Processing time: ${processingTime}s`;
                    messageDiv.appendChild(debugInfo);
                }
                
                conversationDiv.appendChild(messageDiv);
                
                // Scroll to bottom
                conversationDiv.scrollTop = conversationDiv.scrollHeight;
            }
            
            function playResponseAudio(audioBase64) {
                try {
                    // Convert base64 to array buffer
                    const binaryString = atob(audioBase64);
                    const bytes = new Uint8Array(binaryString.length);
                    
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    
                    // Decode the audio data
                    audioContext.decodeAudioData(bytes.buffer)
                        .then(buffer => {
                            // Create audio source
                            const source = audioContext.createBufferSource();
                            source.buffer = buffer;
                            source.connect(audioContext.destination);
                            source.start(0);
                            
                            statusDiv.textContent = 'Playing response...';
                            
                            // Reset UI when playback finishes
                            source.onended = function() {
                                statusDiv.textContent = 'Ready for next query.';
                                resetUI();
                            };
                        })
                        .catch(error => {
                            console.error('Error decoding audio:', error);
                            errorDiv.textContent = 'Error playing response audio.';
                            resetUI();
                        });
                } catch (error) {
                    console.error('Error processing audio data:', error);
                    errorDiv.textContent = 'Error processing audio data.';
                    resetUI();
                }
            }
            
            function resetUI() {
                listenButton.classList.remove('listening', 'thinking');
                listenButton.textContent = 'Press to Speak';
                listenButton.disabled = false;
            }
        });
    </script>
</body>
</html>
